<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RUAA Salon & Academy</title>
<style>
  :root{
    --ink:#2b1d1a;
    --rose:#a8404a;
    --rose-deep:#7c2c34;
    --cream:#faf3ea;
    --gold:#b8965a;
    --card:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#f2e9e2;
      --cream:#241a17;
      --card:#332521;
    }
  }
  :root[data-theme="dark"]{
    --ink:#f2e9e2;
    --cream:#241a17;
    --card:#332521;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Georgia', 'Iowan Old Style', serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    display:flex;
    justify-content:center;
  }
  .page{
    width:100%;
    max-width:420px;
    padding:48px 28px 40px;
  }
  .mark{
    text-align:center;
    margin-bottom:6px;
  }
  .mark svg{width:46px;height:46px;}
  h1{
    text-align:center;
    font-size:1.9rem;
    letter-spacing:0.02em;
    margin:10px 0 2px;
    font-weight:400;
  }
  .tag{
    text-align:center;
    color:var(--rose);
    font-style:italic;
    font-size:0.95rem;
    margin:0 0 34px;
  }
  .links{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  a.link{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    color:var(--ink);
    text-decoration:none;
    padding:16px 18px;
    border-radius:6px;
    border:1px solid rgba(184,150,90,0.35);
    transition:transform .15s ease, border-color .15s ease;
  }
  a.link:active{transform:scale(0.98);}
  a.link:hover{border-color:var(--rose);}
  .icon{
    flex:0 0 auto;
    width:26px;height:26px;
    color:var(--rose-deep);
  }
  .label{
    flex:1;
  }
  .label .t{
    display:block;
    font-size:1.02rem;
  }
  .label .s{
    display:block;
    font-size:0.78rem;
    opacity:0.65;
    font-family:-apple-system, sans-serif;
    margin-top:2px;
  }
  footer{
    text-align:center;
    margin-top:40px;
    font-size:0.78rem;
    opacity:0.55;
    font-family:-apple-system, sans-serif;
  }
</style>
</head>
<body>
<div class="page">
  <div class="mark">
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="24" cy="24" r="22" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
      <path d="M24 12c-5 4-8 9-8 14a8 8 0 0 0 16 0c0-5-3-10-8-14z" fill="currentColor" opacity="0.85"/>
    </svg>
  </div>
  <h1>RUAA Salon &amp; Academy</h1>
  <p class="tag">Two branches in Virar West</p>

  <div class="links">
    <a class="link" href="https://maps.app.goo.gl/au4pHbPxZSGCkzdr6">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-6.2-7-12a7 7 0 1 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>
      <span class="label"><span class="t">Branch 1 — Directions</span><span class="s">Google Maps · GPS location</span></span>
    </a>

    <a class="link" href="https://maps.app.goo.gl/xuP5UoehRbyWiPkZ6">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-6.2-7-12a7 7 0 1 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>
      <span class="label"><span class="t">Branch 2 — Directions</span><span class="s">Google Maps · GPS location</span></span>
    </a>

    <a class="link" href="https://wa.me/919320544544?text=Hi%20Ruaa%20salon%20and%20academy">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20l1.4-4.2A8 8 0 1 1 9 18.6L4 20z"/><path d="M9 10.5c.3 1.8 2.2 3.7 4 4"/></svg>
      <span class="label"><span class="t">Message on WhatsApp</span><span class="s">Book an appointment</span></span>
    </a>

    <a class="link" href="https://www.instagram.com/ruaa.salon/">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="12" cy="12" r="3.6"/><circle cx="17" cy="7" r="0.8" fill="currentColor" stroke="none"/></svg>
      <span class="label"><span class="t">Follow on Instagram</span><span class="s">@ruaa.salon</span></span>
    </a>

  </div>

  <footer>Everything about RUAA Salon &amp; Academy, in one place.</footer>
</div>
</body>
</html>
